[project]
name = "nsa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch",
  "numpy",
  "scikit-learn",
  "einops",
  "tqdm",
  "pillow",
  "networkx",
  "matplotlib",
  "scipy",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pyupgrade>=3.21.0",
    "ruff>=0.14.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
  # Star imports are widely used in this repo's transformation modules
  "F403",  # 'from module import *' used; unable to detect undefined names
  "F405",  # Name may be undefined, or defined from star imports
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
